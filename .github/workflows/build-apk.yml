name: Build Soul Browser APK

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build optimized Android packages
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses
          true

      - name: Install Android SDK packages
        shell: bash
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify build inputs
        shell: bash
        run: |
          java -version
          gradle --version
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest testReleaseUnitTest --stacktrace

      - name: Build optimized installable debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Build optimized release APK
        run: gradle --no-daemon assembleRelease --stacktrace

      - name: Build Android App Bundle
        run: gradle --no-daemon bundleRelease --stacktrace

      - name: Report package sizes
        shell: bash
        run: |
          ls -lh app/build/outputs/apk/debug/*.apk
          ls -lh app/build/outputs/apk/release/*.apk
          ls -lh app/build/outputs/bundle/release/*.aab
          sha256sum app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab

      - name: Upload optimized installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Soul-Browser-optimized-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload optimized release APK
        uses: actions/upload-artifact@v4
        with:
          name: Soul-Browser-optimized-ARM64-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Soul-Browser-release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
